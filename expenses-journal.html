<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses Journal · 日常账本</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#243c35;background:#f5f6f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d3a351;outline-offset:3px}.shell{max-width:1200px;margin:auto;padding:36px 28px}header,.topline,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Georgia,serif;font-size:25px}.brand small{display:block;font:11px system-ui;letter-spacing:3px;color:#78877d;margin-top:8px}.pill{border:1px solid #d8dfd4;border-radius:30px;padding:10px 15px;background:transparent;color:#476252}.intro{margin:55px 0 30px}.eyebrow{color:#7e8f73;font-size:12px;letter-spacing:2px}h1{font-size:36px;letter-spacing:-1px;margin:12px 0}p{color:#7a887e;font-size:14px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.stat{padding:27px;border:1px solid #dde3d8;border-radius:17px;background:#fffefa}.stat:first-child{background:#244b3e;color:white;border-color:#244b3e}.stat label{font-size:13px;opacity:.7}.value{font-size:31px;margin:16px 0 5px;font-weight:600;letter-spacing:-1px}.hint{font-size:12px;opacity:.6}.layout{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}.panel{background:#fffefa;border:1px solid #dde3d8;border-radius:17px;padding:26px}h2{font-size:18px;margin:0 0 24px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select{border:1px solid #dce2d7;border-radius:9px;padding:11px 12px;background:#fffefa;color:#2e493f;min-width:0}input:focus,select:focus{outline:2px solid #97b09a}#search{flex:1;width:140px}.entry{display:flex;align-items:center;gap:13px;padding:19px 0;border-bottom:1px solid #edf0e8}.icon{background:#eef1e6;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.entrymain{flex:1;min-width:0}.entrytitle{font-size:14px;font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;color:#899287;margin-top:7px}.amount{font-size:15px;font-weight:600;white-space:nowrap}.income{color:#4f8765}.expense{color:#ae7257}.mini{border:0;background:transparent;color:#849182;font-size:12px;padding:5px}.entrytools{display:flex;justify-content:flex-end;margin-top:5px}.field{display:grid;gap:8px;margin-bottom:17px}.field label{font-size:12px;color:#738275}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{background:#284f40;color:white;border:0;border-radius:9px;padding:13px 18px;width:100%}.secondary{background:#eef1e6;border:0;border-radius:9px;padding:11px 14px;color:#49634e}.segments{display:flex;background:#f0f2e9;padding:4px;border-radius:10px;margin-bottom:23px}.segments button{flex:1;border:0;background:transparent;padding:10px;border-radius:7px;color:#7d8a79}.segments button.active{background:#fffefa;color:#284f40;box-shadow:0 2px 5px #243c3510}.breakdown{margin-top:23px}.bar{height:6px;border-radius:9px;background:#edf0e6;margin:9px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:#9cae80;border-radius:9px}.empty{text-align:center;padding:45px 10px;color:#8b9788;font-size:14px}footer{margin-top:30px;display:flex;justify-content:space-between;gap:20px;color:#93a08e;font-size:12px}#status{font-size:13px;color:#5c775b;min-height:20px;margin-top:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:850px){.layout{grid-template-columns:1fr}.formpanel{grid-row:1}.intro{margin-top:35px}.value{font-size:24px}.stat{padding:20px}}@media(max-width:540px){.shell{padding:24px 16px}header{align-items:flex-start}.brand{font-size:21px}.stats{gap:8px}.stat{padding:16px 10px}.value{font-size:19px}.hint{font-size:10px}h1{font-size:29px}.panel{padding:20px}.topline{align-items:flex-start;flex-direction:column}.entry{gap:9px}.icon{width:35px;height:35px}footer{flex-direction:column}}

.calendarpanel{margin:24px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekday{text-align:center;font-size:12px;color:#8a9785;padding:10px}.day{min-height:96px;background:#f7f8f2;border:1px solid transparent;border-radius:10px;text-align:left;padding:12px;display:flex;flex-direction:column;gap:6px;color:#334f40}.day:hover{background:#edf1e5}.day.today .daynum{color:#b17a32;font-weight:bold}.day.selected{border-color:#789776;background:#edf2e7}.day.blank{background:transparent}.daynum{font-size:14px;margin-bottom:5px}.dayexpense{color:#ad735a;font-size:12px;overflow-wrap:anywhere}.dayincome{color:#498365;font-size:12px;overflow-wrap:anywhere}details{font-size:12px;color:#7b8b76;margin:0 0 20px}summary{cursor:pointer;margin-bottom:15px}.layout{grid-template-columns:1fr 340px}@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(max-width:540px){.calendar{gap:3px}.calendarpanel{padding:12px}.day{min-height:81px;padding:7px 3px;gap:4px}.dayexpense,.dayincome{font-size:9px}.daynum{font-size:12px}.calendarpanel .row{gap:5px;align-items:flex-start;flex-direction:column}.calendarpanel h2{margin-bottom:5px}}
</style></head>
<body><main class="shell"><header><div class="brand">Expenses Journal<small>把日子，记得清楚一点。</small></div><label class="sr" for="currency">显示货币</label><select id="currency" class="pill"><option value="MYR">MYR · RM</option><option value="CNY">CNY · ¥</option><option value="USD">USD · $</option><option value="SGD">SGD · S$</option></select></header>
<section class="intro"><div class="eyebrow">YOUR EVERYDAY, ACCOUNTED FOR</div><div class="topline"><div><h1>这个月，花多少？赚多少？</h1><p>一眼看清收支。输入金额，轻松记一笔。</p></div><div><label class="sr" for="month">统计月份</label><input id="month" type="month" required></div></div></section>
<section class="stats" aria-label="月度概览"><div class="stat"><label>这个月剩下</label><div class="value" id="balance">0.00</div><div class="hint">本月收入 − 本月支出</div></div><div class="stat"><label>这个月赚了 ↗</label><div class="value" id="totalIncome">0.00</div><div class="hint" id="incomeCount"></div></div><div class="stat"><label>这个月花了 ↘</label><div class="value" id="totalExpense">0.00</div><div class="hint" id="expenseCount"></div></div></section>
<section class="panel calendarpanel"><div class="row"><h2>本月收支日历</h2><span class="meta">点击日期，记录当天收支</span></div><div class="calendar" id="calendar"></div></section><div class="layout"><section class="panel"><div class="row"><h2>收支明细 <span id="count" class="meta"></span></h2><button id="exportExcel" class="secondary">导出 Excel 总账</button><button id="exportCsv" class="mini">导出 CSV ↗</button></div><div class="filters"><input id="search" aria-label="搜索备注或分类" placeholder="搜索备注或分类…"><select id="filter" aria-label="筛选收支"><option value="all">全部收支</option><option value="expense">仅支出</option><option value="income">仅收入</option></select></div><div id="entries"></div><div class="breakdown"><h2>支出去哪了</h2><div id="categories"></div></div></section>
<aside class="panel formpanel"><h2 id="formTitle">记一笔</h2><form id="form"><div class="segments"><button type="button" data-type="expense" class="active" aria-pressed="true">↘ 支出</button><button type="button" data-type="income" aria-pressed="false">↗ 收入</button></div><div class="field"><label for="amount">金额</label><input id="amount" type="number" min="0.01" max="999999999" step="0.01" placeholder="0.00" required></div><div class="field"><label for="date">记在哪一天</label><input id="date" type="date" required></div><details><summary>分类和备注（可不填）</summary><div class="field"><label for="category">分类</label><select id="category"></select></div><div class="field"><label for="note">备注</label><input id="note" maxlength="120" placeholder="选填"></div></details><button class="primary" id="save" type="submit">＋ 添加</button><button class="mini" type="button" id="cancel" hidden>取消编辑</button></form><div id="status" role="status" aria-live="polite"></div><p style="font-size:12px;border-top:1px solid #e9ede2;padding-top:16px">每一笔小记录，都是对生活的认真。</p><div class="toolbar"><button class="secondary" id="backup">备份 JSON</button><button class="secondary" id="restore">恢复备份</button><input type="file" id="import" accept="application/json,.json" hidden></div><p style="font-size:11px">数据仅保存在当前浏览器。清除浏览器数据可能丢失记录，请定期备份。切换货币只更改显示符号，不进行汇率换算。</p></aside></div><footer><span>EXPENSES JOURNAL / 我的日常账本</span><span>慢慢记录，好好生活。</span></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='expensesjournal.v1';
const groups={expense:['餐饮','购物','交通','居家','娱乐','健康','学习','其他'],income:['工资','奖金','兼职','投资','其他收入']};
const icons={'餐饮':'☕','购物':'🛍','交通':'🚇','居家':'🏡','娱乐':'🎧','健康':'🌿','学习':'📚','其他':'🧾','工资':'💼','奖金':'✨','兼职':'💻','投资':'📈','其他收入':'💰'};
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let records=[],currency='MYR',type='expense',editing=null;
function valid(r){return r&&typeof r.id==='string'&&['expense','income'].includes(r.type)&&Number.isSafeInteger(r.cents)&&r.cents>0&&r.cents<=99999999900&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&!isNaN(Date.parse(r.date))&&groups[r.type].includes(r.category)&&typeof r.note==='string'&&r.note.length<=120}
try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data){if(!Array.isArray(data.records)||!data.records.every(valid))throw Error();records=data.records;if(['MYR','CNY','USD','SGD'].includes(data.currency))currency=data.currency}}catch(e){$('status').textContent='无法读取本地记录，请检查浏览器存储或恢复备份。'}
$('currency').value=currency;$('date').value=localDate();$('month').value=localDate().slice(0,7);
function persist(next=records,nextCurrency=currency){try{localStorage.setItem(KEY,JSON.stringify({version:1,currency:nextCurrency,records:next}));records=next;currency=nextCurrency;return true}catch(e){$('status').textContent='保存失败：浏览器存储不可用或空间不足，请先备份。';return false}}
const money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency,minimumFractionDigits:2}).format(n/100);
function setType(t){type=t;document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('active',b.dataset.type===t);b.setAttribute('aria-pressed',String(b.dataset.type===t))});$('category').replaceChildren(...groups[t].map(c=>new Option(c,c)));$('category').value=t==='expense'?'其他':'其他收入'}
function reset(){const selected=$('date').value;editing=null;$('form').reset();$('date').value=selected||localDate();setType('expense');$('formTitle').textContent='记一笔';$('save').textContent='＋ 添加';$('cancel').hidden=true}
function render(){const monthly=records.filter(r=>r.date.startsWith($('month').value));const ins=monthly.filter(r=>r.type==='income'),outs=monthly.filter(r=>r.type==='expense');const sum=a=>a.reduce((s,r)=>s+r.cents,0);$('balance').textContent=money(sum(ins)-sum(outs));$('totalIncome').textContent=money(sum(ins));$('totalExpense').textContent=money(sum(outs));$('incomeCount').textContent=`共 ${ins.length} 笔收入`;$('expenseCount').textContent=`共 ${outs.length} 笔支出`;
const q=$('search').value.toLowerCase().trim();const shown=monthly.filter(r=>($('filter').value==='all'||r.type===$('filter').value)&&`${r.note} ${r.category}`.toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('count').textContent=`${shown.length} 笔`;$('entries').replaceChildren();if(!shown.length){const e=document.createElement('div');e.className='empty';e.textContent=monthly.length?'没有符合筛选条件的记录。':'这个月的故事，从第一笔开始。';$('entries').append(e)}
shown.forEach(r=>{const el=document.createElement('div');el.className='entry';el.innerHTML='<div class="icon"></div><div class="entrymain"><div class="entrytitle"></div><div class="meta"></div></div><div><div class="amount"></div><div class="entrytools"><button class="mini edit">编辑</button><button class="mini delete">删除</button></div></div>';el.querySelector('.icon').textContent=icons[r.category]||'🧾';el.querySelector('.entrytitle').textContent=r.note||r.category;el.querySelector('.meta').textContent=`${r.date} · ${r.category}`;el.querySelector('.amount').textContent=(r.type==='income'?'+':'−')+money(r.cents);el.querySelector('.amount').classList.add(r.type);el.querySelector('.edit').onclick=()=>{editing=r.id;setType(r.type);$('amount').value=(r.cents/100).toFixed(2);$('date').value=r.date;$('category').value=r.category;$('note').value=r.note;$('formTitle').textContent='编辑记录';$('save').textContent='保存修改';$('cancel').hidden=false;$('formTitle').scrollIntoView({behavior:'smooth',block:'center'});$('amount').focus()};el.querySelector('.delete').onclick=()=>{if(confirm('确定删除这笔记录吗？')){if(persist(records.filter(x=>x.id!==r.id))){if(editing===r.id)reset();render();$('status').textContent='记录已删除。'}}};$('entries').append(el)});
renderCalendar(monthly);$('categories').replaceChildren();const totals={};outs.forEach(r=>totals[r.category]=(totals[r.category]||0)+r.cents);if(!outs.length){$('categories').textContent='暂无支出数据。';$('categories').style.color='#899287'}Object.entries(totals).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{const wrap=document.createElement('div');const pct=n/sum(outs)*100;wrap.innerHTML='<div class="row" style="font-size:12px"><span></span><span></span></div><div class="bar"><i></i></div>';wrap.querySelector('span').textContent=c;wrap.querySelectorAll('span')[1].textContent=`${money(n)} · ${pct.toFixed(0)}%`;wrap.querySelector('i').style.width=pct+'%';$('categories').append(wrap)})}
function renderCalendar(monthly){
const cal=$('calendar');cal.replaceChildren();
['一','二','三','四','五','六','日'].forEach(d=>{const e=document.createElement('div');e.className='weekday';e.textContent=d;cal.append(e)});
const [year,month]=$('month').value.split('-').map(Number),offset=(new Date(year,month-1,1).getDay()+6)%7,days=new Date(year,month,0).getDate();
for(let i=0;i<offset;i++){const blank=document.createElement('div');blank.className='day blank';cal.append(blank)}
for(let d=1;d<=days;d++){const key=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`,rows=monthly.filter(r=>r.date===key);const inc=rows.filter(r=>r.type==='income').reduce((v,r)=>v+r.cents,0),exp=rows.filter(r=>r.type==='expense').reduce((v,r)=>v+r.cents,0);const b=document.createElement('button');b.type='button';b.className='day'+(key===localDate()?' today':'')+(key===$('date').value?' selected':'');b.setAttribute('aria-label',`${key}，收入 ${money(inc)}，支出 ${money(exp)}`);const n=document.createElement('span');n.className='daynum';n.textContent=d;b.append(n);if(exp){const a=document.createElement('span');a.className='dayexpense';a.textContent='−'+money(exp);b.append(a)}if(inc){const a=document.createElement('span');a.className='dayincome';a.textContent='+'+money(inc);b.append(a)}b.onclick=()=>{if(editing)reset();$('date').value=key;renderCalendar(monthly);$('amount').focus();$('status').textContent=`正在记录 ${key} 的收支`};cal.append(b)}
}
$('date').addEventListener('change',()=>renderCalendar(records.filter(r=>r.date.startsWith($('month').value))));
$('form').onsubmit=e=>{e.preventDefault();const cents=Math.round(Number($('amount').value)*100);const r={id:editing||crypto.randomUUID(),type,cents,date:$('date').value,category:$('category').value,note:$('note').value.trim()};if(!valid(r)){$('status').textContent='请检查金额、日期和分类。';return}const next=editing?records.map(x=>x.id===editing?r:x):[...records,r];if(persist(next)){$('month').value=r.date.slice(0,7);reset();render();$('status').textContent='已保存，今天也记得很认真。'}};
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('cancel').onclick=reset;['month','filter'].forEach(id=>$(id).onchange=()=>{if(!$('month').value)$('month').value=localDate().slice(0,7);render()});$('search').oninput=render;$('currency').onchange=()=>{if(persist(records,$('currency').value))render();else $('currency').value=currency};
function download(data,name,mime){const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('backup').onclick=()=>download(JSON.stringify({version:1,currency,records},null,2),`expenses-journal-${localDate()}.json`,'application/json');$('restore').onclick=()=>$('import').click();$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error();const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.records)||!d.records.every(valid)||new Set(d.records.map(r=>r.id)).size!==d.records.length||!['MYR','CNY','USD','SGD'].includes(d.currency))throw Error();if(confirm(`恢复 ${d.records.length} 笔记录？这会替换当前记录，建议先备份。`)){if(persist(d.records,d.currency)){$('currency').value=currency;reset();render();$('status').textContent='备份已恢复。'}}}catch(err){$('status').textContent='恢复失败：文件格式或数据不正确。'}finally{e.target.value=''}};
$('exportCsv').onclick=()=>{const clean=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const rows=[['日期','类型','分类','金额','货币','备注'],...records.filter(r=>r.date.startsWith($('month').value)).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>[r.date,r.type==='income'?'收入':'支出',r.category,(r.cents/100).toFixed(2),currency,r.note])];download('\uFEFF'+rows.map(row=>row.map(clean).join(',')).join('\r\n'),`expenses-${$('month').value}.csv`,'text/csv;charset=utf-8')};setType(type);render();

// Standalone, uncompressed ZIP writer: the workbook works without a network connection.
function zipFiles(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0;const crc=data=>{let c=0xffffffff;for(const b of data){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0};const header=(size,values)=>{const a=new Uint8Array(size),v=new DataView(a.buffer);for(const [at,n,width]of values)width===2?v.setUint16(at,n,true):v.setUint32(at,n,true);return a};for(const [name,content]of Object.entries(files)){const n=enc.encode(name),d=enc.encode(content),c=crc(d);const local=header(30,[[0,0x04034b50,4],[4,20,2],[14,c,4],[18,d.length,4],[22,d.length,4],[26,n.length,2]]);parts.push(local,n,d);central.push(header(46,[[0,0x02014b50,4],[4,20,2],[6,20,2],[16,c,4],[20,d.length,4],[24,d.length,4],[28,n.length,2],[42,offset,4]]),n);offset+=30+n.length+d.length}const size=central.reduce((n,a)=>n+a.length,0);return new Blob([...parts,...central,header(22,[[0,0x06054b50,4],[8,Object.keys(files).length,2],[10,Object.keys(files).length,2],[12,size,4],[16,offset,4]])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function ledgerWorkbook(){const month=$('month').value,rows=records.filter(r=>r.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));const opening=records.filter(r=>r.date<month+'-01').reduce((n,r)=>n+(r.type==='income'?r.cents:-r.cents),0);let balance=opening;const xml=v=>String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const cell=(ref,value,style=0,formula=null)=>typeof value==='number'?`<c r="${ref}" s="${style}">${formula?`<f>${xml(formula)}</f>`:''}<v>${value}</v></c>`:`<c r="${ref}" t="inlineStr" s="${style}"><is><t xml:space="preserve">${xml(value)}</t></is></c>`;let sheet='';const add=(r,values,style=0)=>{sheet+=`<row r="${r}">`+values.map((v,i)=>cell(String.fromCharCode(65+i)+r,v,style)).join('')+'</row>'};add(1,['Expenses Journal · Accounting Ledger'],1);add(2,['月份',month,'货币',currency]);add(3,['期初结余（此前全部记录）','','','','','',opening/100],2);add(4,['日期 Date','类型 Type','分类 Category','备注 Description','收入 Money In','支出 Money Out','结余 Balance'],1);rows.forEach((r,i)=>{const n=i+5;balance+=r.type==='income'?r.cents:-r.cents;const date=Math.round((Date.parse(r.date+'T00:00:00Z')-Date.UTC(1899,11,30))/86400000);sheet+=`<row r="${n}">`+cell('A'+n,date,3)+cell('B'+n,r.type==='income'?'收入':'支出')+cell('C'+n,r.category)+cell('D'+n,r.note)+cell('E'+n,r.type==='income'?r.cents/100:0,2)+cell('F'+n,r.type==='expense'?r.cents/100:0,2)+cell('G'+n,balance/100,2,`G${i? n-1:3}+E${n}-F${n}`)+'</row>'});const n=rows.length+5,inc=rows.filter(r=>r.type==='income').reduce((a,r)=>a+r.cents,0),exp=rows.filter(r=>r.type==='expense').reduce((a,r)=>a+r.cents,0);sheet+=`<row r="${n}">`+cell('A'+n,'本月合计',1)+cell('E'+n,inc/100,2,rows.length?`SUM(E5:E${n-1})`:'0')+cell('F'+n,exp/100,2,rows.length?`SUM(F5:F${n-1})`:'0')+cell('G'+n,balance/100,2,`G3+E${n}-F${n}`)+'</row>';add(n+2,['说明：个人现金收支账；结余根据已记录的历史收支计算。']);
const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';return zipFiles({
'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
'_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
'xl/workbook.xml':`<workbook xmlns="${ns}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Accounting Ledger" sheetId="1" r:id="rId1"/></sheets><calcPr fullCalcOnLoad="1"/></workbook>`,
'xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
'xl/styles.xml':`<styleSheet xmlns="${ns}"><numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.00;[Red](#,##0.00)"/><numFmt numFmtId="165" formatCode="yyyy-mm-dd"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF284F40"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
'xl/worksheets/sheet1.xml':`<worksheet xmlns="${ns}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="15" customWidth="1"/><col min="2" max="3" width="16" customWidth="1"/><col min="4" max="4" width="40" customWidth="1"/><col min="5" max="7" width="21" customWidth="1"/></cols><sheetData>${sheet}</sheetData><autoFilter ref="A4:G${Math.max(4,n-1)}"/></worksheet>`})}
$('exportExcel').onclick=()=>{const url=URL.createObjectURL(ledgerWorkbook()),a=document.createElement('a');a.href=url;a.download=`accounting-ledger-${$('month').value}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出所选月份的 Excel 总账。'};
